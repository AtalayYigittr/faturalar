<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // Yardımcılar
  // ------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  const AY_KISA = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  const paraFmt = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const para = (n) => paraFmt.format(Number(n) || 0) + ' ₺';
  const kisaPara = (n) => n >= 1e6 ? (n / 1e6).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) + ' M'
    : n >= 1e3 ? (n / 1e3).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) + ' B' : Math.round(n).toLocaleString('tr-TR');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tarihTR = (s) => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '';

  function sayiCoz(s) {
    if (s === null || s === undefined || s === '') return null;
    if (typeof s === 'number') return isFinite(s) ? s : null;
    let t = String(s).replace(/[^\d.,-]/g, '');
    if (!t) return null;
    const sv = t.lastIndexOf(','), sn = t.lastIndexOf('.');
    if (sv > sn) t = t.replace(/\./g, '').replace(',', '.');
    else if (sn > sv) t = (t.length - sn - 1 === 3 && sv === -1 && !/^0\./.test(t)) ? t.replace(/\./g, '') : t.replace(/,/g, '');
    const n = parseFloat(t);
    return isFinite(n) ? n : null;
  }
  const r2 = (n) => Math.round(n * 100) / 100;
  const sayiYaz = (n) => (n === null || n === undefined || n === '') ? '' : paraFmt.format(n);

  function sunucu(fn, ...args) {
    return new Promise((coz, red) => {
      google.script.run.withSuccessHandler(coz).withFailureHandler((e) => red(e && e.message ? e : new Error(String(e))))[fn](...args);
    });
  }

  let bildirimZaman;
  function bildir(mesaj, hata) {
    const b = $('bildirim');
    b.textContent = mesaj; b.className = 'bildirim' + (hata ? ' hata' : ''); b.hidden = false;
    clearTimeout(bildirimZaman);
    bildirimZaman = setTimeout(() => { b.hidden = true; }, hata ? 6000 : 2800);
  }

  function sor(mesaj, evetYazi) {
    return new Promise((coz) => {
      $('modal-mesaj').textContent = mesaj;
      $('modal-evet').textContent = evetYazi || 'Evet';
      $('modal').hidden = false;
      const kapat = (v) => { $('modal').hidden = true; $('modal-evet').onclick = $('modal-hayir').onclick = null; coz(v); };
      $('modal-evet').onclick = () => kapat(true);
      $('modal-hayir').onclick = () => kapat(false);
    });
  }

  async function mesgul(btn, is) {
    const eski = btn.textContent;
    btn.disabled = true; btn.classList.add('yukleniyor');
    try { return await is(); } finally { btn.disabled = false; btn.classList.remove('yukleniyor'); btn.textContent = eski; }
  }

  // ------------------------------------------------------------------
  // Durum
  // ------------------------------------------------------------------
  const D = { kategoriler: [], ayarlar: {}, bugun: '', kayitlarEski: true, raporEski: true, raporMod: 'aylik', seciliAy: 0, rapor: null };

  // ------------------------------------------------------------------
  // Sayfa geçişleri
  // ------------------------------------------------------------------
  function sayfaAc(ad) {
    document.querySelectorAll('.sayfa').forEach((s) => s.classList.toggle('aktif', s.id === 's-' + ad));
    document.querySelectorAll('#menu button').forEach((b) => b.classList.toggle('aktif', b.dataset.sayfa === ad));
    window.scrollTo(0, 0);
    if (ad === 'kayitlar' && D.kayitlarEski) kayitlariYukle();
    if (ad === 'rapor' && D.raporEski) raporYukle();
  }
  document.querySelectorAll('#menu button').forEach((b) => b.addEventListener('click', () => sayfaAc(b.dataset.sayfa)));

  // ------------------------------------------------------------------
  // Kategoriler
  // ------------------------------------------------------------------
  const YENI_KAT = '__yeni__';
  function kategorileriDoldur() {
    const sec = $('f-kategori'), mevcut = sec.value;
    sec.innerHTML = '<option value="">Seçin…</option>' +
      D.kategoriler.map((k) => `<option>${esc(k)}</option>`).join('') +
      `<option value="${YENI_KAT}">＋ Yeni kategori…</option>`;
    if (mevcut && mevcut !== YENI_KAT) kategoriSec(mevcut);

    const kf = $('k-kategori'), kfm = kf.value;
    kf.innerHTML = '<option value="">Tüm kategoriler</option>' + D.kategoriler.map((k) => `<option>${esc(k)}</option>`).join('');
    kf.value = kfm;

    $('kat-liste').innerHTML = D.kategoriler.map((k) =>
      `<span>${esc(k)}<button type="button" data-sil="${esc(k)}" title="Sil">×</button></span>`).join('') || '<span class="soluk">Kategori yok</span>';
  }
  function kategoriSec(ad) {
    const sec = $('f-kategori');
    if (ad && !D.kategoriler.includes(ad)) { // listede olmayan eski kategori
      const o = document.createElement('option'); o.textContent = ad; sec.insertBefore(o, sec.lastElementChild);
    }
    sec.value = ad || '';
  }
  $('f-kategori').addEventListener('change', (e) => {
    if (e.target.value === YENI_KAT) { $('yeni-kat-kutu').hidden = false; $('yeni-kat-ad').focus(); e.target.value = ''; }
  });
  $('yeni-kat-iptal').addEventListener('click', () => { $('yeni-kat-kutu').hidden = true; });
  $('yeni-kat-ekle').addEventListener('click', (e) => kategoriEkle($('yeni-kat-ad'), e.target, true));
  $('kat-ekle').addEventListener('click', (e) => kategoriEkle($('kat-yeni'), e.target, false));
  async function kategoriEkle(girdi, btn, sec) {
    const ad = girdi.value.trim();
    if (!ad) return;
    try {
      D.kategoriler = await mesgul(btn, () => sunucu('kategoriEkle', ad));
      girdi.value = '';
      kategorileriDoldur();
      if (sec) { kategoriSec(ad); $('yeni-kat-kutu').hidden = true; $('f-kategori').classList.remove('eksik'); }
      bildir('"' + ad + '" eklendi');
    } catch (err) { bildir(err.message, true); }
  }
  $('kat-liste').addEventListener('click', async (e) => {
    const ad = e.target.dataset && e.target.dataset.sil;
    if (!ad) return;
    if (!(await sor('"' + ad + '" kategorisi silinsin mi? Eski kayıtlar değişmez.', 'Sil'))) return;
    try { D.kategoriler = await sunucu('kategoriSil', ad); kategorileriDoldur(); bildir('Silindi'); }
    catch (err) { bildir(err.message, true); }
  });

  // ------------------------------------------------------------------
  // Form
  // ------------------------------------------------------------------
  const ALANLAR = ['tarih', 'aciklama', 'kategori', 'firma', 'belgeNo', 'toplam', 'kdv', 'not'];

  function formTemizle() {
    ['id', 'belgeUrl', 'kaynak', 'aciklama', 'firma', 'belgeNo', 'toplam', 'kdv', 'not'].forEach((a) => { $('f-' + a).value = ''; });
    $('f-tarih').value = D.bugun;
    kategoriSec('');
    document.querySelectorAll('#form .eksik').forEach((el) => el.classList.remove('eksik'));
    $('form-baslik').textContent = 'Yeni harcama';
    $('sil-btn').hidden = true;
    $('f-belge-link').hidden = true;
    $('okuma-durum').hidden = true;
    $('onizleme').hidden = true;
    $('ham-kutu').hidden = true;
    $('yukle-kart').hidden = false;
    kdvHaricGoster();
  }

  function formDoldur(v, eksikler) {
    if (v.tarih) $('f-tarih').value = v.tarih;
    ['aciklama', 'firma', 'belgeNo', 'not'].forEach((a) => { if (v[a] != null && v[a] !== '') $('f-' + a).value = v[a]; });
    $('f-toplam').value = sayiYaz(v.toplam);
    $('f-kdv').value = sayiYaz(v.kdv);
    if (v.kategori) kategoriSec(v.kategori);
    $('f-belgeUrl').value = v.belgeUrl || '';
    $('f-kaynak').value = v.kaynak || '';
    $('f-belge-link').hidden = !v.belgeUrl;
    $('f-belge-link').href = v.belgeUrl || '#';
    document.querySelectorAll('#form .eksik').forEach((el) => el.classList.remove('eksik'));
    (eksikler || []).forEach((a) => { const el = $('f-' + a); if (el) el.classList.add('eksik'); });
    if (!$('f-kategori').value) $('f-kategori').classList.add('eksik');
    kdvHaricGoster();
  }

  ALANLAR.forEach((a) => $('f-' + a).addEventListener('input', (e) => e.target.classList.remove('eksik')));
  $('f-kategori').addEventListener('change', (e) => { if (e.target.value) e.target.classList.remove('eksik'); });
  $('f-toplam').addEventListener('input', kdvHaricGoster);
  $('f-kdv').addEventListener('input', kdvHaricGoster);

  function kdvHaricGoster() {
    const t = sayiCoz($('f-toplam').value), k = sayiCoz($('f-kdv').value);
    $('kdv-haric').textContent = (t > 0 && k !== null) ? 'KDV hariç: ' + para(t - k) : '';
  }
  document.querySelectorAll('.oranlar button').forEach((b) => b.addEventListener('click', () => {
    const t = sayiCoz($('f-toplam').value);
    if (!(t > 0)) { bildir('Önce toplam tutarı girin', true); $('f-toplam').focus(); return; }
    const o = Number(b.dataset.oran);
    $('f-kdv').value = sayiYaz(r2(t * o / (100 + o)));
    $('f-kdv').classList.remove('eksik');
    kdvHaricGoster();
  }));

  function formOku() {
    const h = { id: $('f-id').value, tarih: $('f-tarih').value, aciklama: $('f-aciklama').value.trim(), kategori: $('f-kategori').value,
      firma: $('f-firma').value.trim(), belgeNo: $('f-belgeNo').value.trim(), toplam: sayiCoz($('f-toplam').value),
      kdv: sayiCoz($('f-kdv').value), not: $('f-not').value.trim(), belgeUrl: $('f-belgeUrl').value, kaynak: $('f-kaynak').value || 'Manuel' };
    const hatalar = [];
    if (!h.tarih) hatalar.push('tarih');
    if (!h.aciklama) hatalar.push('aciklama');
    if (!h.kategori || h.kategori === YENI_KAT) hatalar.push('kategori');
    if (!(h.toplam > 0)) hatalar.push('toplam');
    if (h.kdv !== null && h.toplam > 0 && h.kdv > h.toplam) hatalar.push('kdv');
    hatalar.forEach((a) => $('f-' + a).classList.add('eksik'));
    return { h, hatalar };
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { h, hatalar } = formOku();
    if (hatalar.length) { bildir('Lütfen işaretli alanları düzeltin', true); return; }
    const btn = $('kaydet-btn');
    try {
      if (h.id) {
        await mesgul(btn, () => sunucu('harcamaGuncelle', h));
        bildir('Güncellendi');
        formTemizle(); D.kayitlarEski = D.raporEski = true; sayfaAc('kayitlar');
        return;
      }
      let s = await mesgul(btn, () => sunucu('harcamaKaydet', h, false));
      if (s.kopya) {
        if (!(await sor(s.mesaj, 'Yine de kaydet'))) return;
        s = await mesgul(btn, () => sunucu('harcamaKaydet', h, true));
      }
      bildir('Kaydedildi ✓');
      formTemizle(); D.kayitlarEski = D.raporEski = true;
    } catch (err) { bildir(err.message, true); }
  });

  $('temizle-btn').addEventListener('click', formTemizle);
  $('sil-btn').addEventListener('click', async () => {
    const id = $('f-id').value;
    if (!id || !(await sor('Bu harcama kalıcı olarak silinsin mi?', 'Sil'))) return;
    try {
      await mesgul($('sil-btn'), () => sunucu('harcamaSil', id));
      bildir('Silindi'); formTemizle(); D.kayitlarEski = D.raporEski = true; sayfaAc('kayitlar');
    } catch (err) { bildir(err.message, true); }
  });

  function duzenle(k) {
    formTemizle();
    $('f-id').value = k.id;
    formDoldur(k, k.durum === 'Kontrol Et' ? (k.kdv === null ? ['kdv'] : []).concat(k.kategori ? [] : ['kategori']) : []);
    $('form-baslik').textContent = 'Harcamayı düzenle';
    $('sil-btn').hidden = false;
    $('yukle-kart').hidden = true;
    sayfaAc('yeni');
  }

  // ------------------------------------------------------------------
  // Belge yükleme / okuma
  // ------------------------------------------------------------------
  $('kamera').addEventListener('change', dosyaSecildi);
  $('dosya').addEventListener('change', dosyaSecildi);

  function dataUrlOku(dosya) {
    return new Promise((coz, red) => {
      const r = new FileReader();
      r.onload = () => coz(r.result);
      r.onerror = () => red(new Error('Dosya okunamadı'));
      r.readAsDataURL(dosya);
    });
  }

  async function resimKucult(dosya, enBuyuk = 1800, kalite = 0.82) {
    const url = await dataUrlOku(dosya);
    const img = await new Promise((coz, red) => { const i = new Image(); i.onload = () => coz(i); i.onerror = () => red(new Error('resim')); i.src = url; });
    const o = Math.min(1, enBuyuk / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * o), h = Math.round(img.naturalHeight * o);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    const sonuc = c.toDataURL('image/jpeg', kalite);
    return { base64: sonuc.split(',')[1], mimeType: 'image/jpeg', ad: dosya.name.replace(/\.[^.]+$/, '') + '.jpg', onizleme: sonuc };
  }

  async function dosyaSecildi(e) {
    const dosya = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!dosya) return;
    if (dosya.size > 25 * 1024 * 1024) { bildir('Dosya çok büyük (en fazla 25 MB)', true); return; }

    const durum = $('okuma-durum');
    durum.hidden = false; durum.className = 'okuma-durum yukleniyor'; durum.textContent = 'Belge okunuyor';
    $('ham-kutu').hidden = true;

    try {
      let paket;
      const xmlMi = /xml/i.test(dosya.type) || /\.xml$/i.test(dosya.name);
      const pdfMi = /pdf/i.test(dosya.type) || /\.pdf$/i.test(dosya.name);
      if (!xmlMi && !pdfMi && /^image\//.test(dosya.type)) {
        try { paket = await resimKucult(dosya); } catch (_) { paket = null; }
      }
      if (!paket) {
        const url = await dataUrlOku(dosya);
        paket = { base64: url.split(',')[1], mimeType: dosya.type || (xmlMi ? 'text/xml' : pdfMi ? 'application/pdf' : 'application/octet-stream'), ad: dosya.name };
      }
      $('onizleme').hidden = !paket.onizleme;
      if (paket.onizleme) $('onizleme').src = paket.onizleme;

      const s = await sunucu('belgeOku', { base64: paket.base64, mimeType: paket.mimeType, ad: paket.ad });
      const korunanId = $('f-id').value;
      formDoldur(s, s.eksikler);
      $('f-id').value = korunanId;

      const eksikAdlar = { tarih: 'tarih', toplam: 'toplam', kdv: 'KDV', aciklama: 'açıklama', kategori: 'kategori' };
      const eksik = (s.eksikler || []).map((a) => eksikAdlar[a] || a);
      durum.className = 'okuma-durum';
      durum.innerHTML = '✓ <b>' + esc(s.yontem) + '</b> ile okundu. ' +
        (eksik.length ? 'Kontrol edin: <b>' + esc(eksik.join(', ')) + '</b>.' : 'Alanları kontrol edip kaydedin.') +
        (s.notlar && s.notlar.length ? '<br><small>' + esc(s.notlar.join(' ')) + '</small>' : '');
      if (s.hamMetin) { $('ham-metin').textContent = s.hamMetin; $('ham-kutu').hidden = false; }
      $('f-aciklama').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) {
      durum.className = 'okuma-durum hata';
      durum.textContent = 'Okunamadı: ' + err.message + ' — Bilgileri elle girebilirsiniz.';
    }
  }

  // ------------------------------------------------------------------
  // Kayıtlar
  // ------------------------------------------------------------------
  function yilSecenekleri(sec, yillar, secili) {
    const bu = new Date().getFullYear();
    const set = new Set((yillar || []).map(String));
    for (let y = bu; y >= bu - 4; y--) set.add(String(y));
    const liste = Array.from(set).sort().reverse();
    sec.innerHTML = liste.map((y) => `<option>${y}</option>`).join('');
    sec.value = String(secili || bu);
  }
  yilSecenekleri($('k-yil'));
  $('k-ay').innerHTML = '<option value="0">Tüm aylar</option>' + AYLAR.map((a, i) => `<option value="${i + 1}">${a}</option>`).join('');
  $('k-ay').value = String(new Date().getMonth() + 1);

  let araZaman;
  ['k-yil', 'k-ay', 'k-kategori', 'k-kontrol'].forEach((id) => $(id).addEventListener('change', kayitlariYukle));
  $('k-ara').addEventListener('input', () => { clearTimeout(araZaman); araZaman = setTimeout(kayitlariYukle, 350); });
  $('k-kontrol').addEventListener('change', () => { if ($('k-kontrol').checked) { $('k-ay').value = '0'; } });

  let sonListe = [];
  async function kayitlariYukle() {
    D.kayitlarEski = false;
    $('k-ozet').innerHTML = '<span class="yukleniyor">Yükleniyor</span>';
    try {
      const kontrol = $('k-kontrol').checked;
      const s = await sunucu('harcamalariListele', { yil: kontrol ? '' : $('k-yil').value, ay: kontrol ? 0 : Number($('k-ay').value),
        kategori: $('k-kategori').value, ara: $('k-ara').value, kontrol });
      sonListe = s.kayitlar;
      rozet(s.kontrolSayisi);
      $('k-ozet').innerHTML = `<b>${s.adet}</b> kayıt · Toplam <b>${para(s.toplam)}</b> · KDV <b>${para(s.kdv)}</b>` +
        (s.adet > s.kayitlar.length ? ` · ilk ${s.kayitlar.length} gösteriliyor` : '');
      $('liste').innerHTML = s.kayitlar.length ? s.kayitlar.map((k, i) => `
        <div class="kayit" data-i="${i}">
          <div class="acik">${esc(k.aciklama)}</div>
          <div class="tutar">${para(k.toplam)}</div>
          <div class="alt">${tarihTR(k.tarih)} · <span class="cip">${esc(k.kategori || 'Kategorisiz')}</span>${k.durum === 'Kontrol Et' ? '<span class="cip uyari">Kontrol et</span>' : ''}${esc(k.firma)}</div>
          <div class="alt-sag">${k.kdv === null ? 'KDV —' : 'KDV ' + para(k.kdv)}</div>
        </div>`).join('') : '<div class="bos">Bu filtrede kayıt yok.</div>';
    } catch (err) { $('k-ozet').textContent = ''; bildir(err.message, true); }
  }
  $('liste').addEventListener('click', (e) => {
    const el = e.target.closest('.kayit');
    if (el) duzenle(sonListe[Number(el.dataset.i)]);
  });
  function rozet(n) { const r = $('kontrol-rozet'); r.hidden = !n; r.textContent = n || ''; }

  // ------------------------------------------------------------------
  // Rapor
  // ------------------------------------------------------------------
  yilSecenekleri($('r-yil'));
  $('r-yil').addEventListener('change', () => { D.seciliAy = 0; raporYukle(); });
  $('r-mod').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    D.raporMod = b.dataset.mod; D.seciliAy = 0;
    $('r-mod').querySelectorAll('button').forEach((x) => x.classList.toggle('aktif', x === b));
    raporCiz();
  });

  async function raporYukle() {
    D.raporEski = false;
    $('r-kutucuk').innerHTML = '<div class="kutucuk yukleniyor">Hesaplanıyor</div>';
    try {
      D.rapor = await sunucu('raporGetir', Number($('r-yil').value));
      yilSecenekleri($('r-yil'), D.rapor.yillar, D.rapor.yil);
      raporCiz();
    } catch (err) { bildir(err.message, true); }
  }

  function kutucuklar(t, kdv, adet, not) {
    $('r-kutucuk').innerHTML = [
      ['Toplam harcama', para(t)], ['KDV', para(kdv)], ['KDV hariç', para(t - kdv)], ['Kayıt', adet + (not ? ' <small>' + not + '</small>' : '')]
    ].map(([a, d]) => `<div class="kutucuk"><small>${a}</small><b>${d}</b></div>`).join('');
  }

  function cubuklar(veri, etiketler, secili) {
    const enBuyuk = Math.max(1, ...veri.map((v) => v.toplam));
    $('r-grafik').innerHTML = veri.map((v, i) => {
      const h = (v.toplam / enBuyuk) * 100, k = v.toplam ? (v.kdv / v.toplam) * 100 : 0;
      return `<div class="cubuk-sar${secili === i + 1 ? ' secili' : ''}" data-i="${i + 1}" title="${etiketler[i]}: ${para(v.toplam)} (KDV ${para(v.kdv)})">
        <span class="deger">${v.toplam ? kisaPara(v.toplam) : ''}</span>
        <div class="cubuk" style="height:${h}%"><i style="height:${k}%"></i></div></div>`;
    }).join('') ;
    $('r-grafik').setAttribute('aria-label', etiketler.map((e, i) => e + ' ' + para(veri[i].toplam)).join(', '));
    let eksen = $('r-eksen');
    if (!eksen) { eksen = document.createElement('div'); eksen.id = 'r-eksen'; eksen.className = 'eksen'; $('r-grafik').after(eksen); }
    eksen.innerHTML = etiketler.map((e) => `<span>${e}</span>`).join('');
  }

  function raporCiz() {
    const R = D.rapor; if (!R) return;
    if (D.raporMod === 'aylik') {
      $('r-yil').hidden = false;
      const g = D.seciliAy ? R.aylar[D.seciliAy - 1] : R.genel;
      kutucuklar(g.toplam, g.kdv, g.adet, !D.seciliAy && R.genel.kdvsiz ? '(' + R.genel.kdvsiz + ' KDV\'siz)' : '');
      $('r-grafik-baslik').textContent = R.yil + ' — aylık harcama' + (D.seciliAy ? ' · seçili: ' + AYLAR[D.seciliAy - 1] : '');
      cubuklar(R.aylar, AY_KISA, D.seciliAy);
      $('r-tablo-baslik').textContent = R.yil + ' aylık özet';
      $('r-tablo').innerHTML = '<tr><th>Ay</th><th>Toplam</th><th>KDV</th><th>KDV hariç</th><th>Adet</th></tr>' +
        R.aylar.map((a, i) => `<tr class="tikla${D.seciliAy === i + 1 ? ' secili' : ''}" data-ay="${i + 1}"><td>${AYLAR[i]}</td><td>${para(a.toplam)}</td><td>${para(a.kdv)}</td><td>${para(a.toplam - a.kdv)}</td><td>${a.adet}</td></tr>`).join('') +
        `<tr class="toplam-satir"><td>Toplam</td><td>${para(R.genel.toplam)}</td><td>${para(R.genel.kdv)}</td><td>${para(R.genel.toplam - R.genel.kdv)}</td><td>${R.genel.adet}</td></tr>`;
      katTablosu(D.seciliAy);
    } else {
      $('r-yil').hidden = false;
      const y = R.yillik.find((x) => x.yil === R.yil) || { toplam: 0, kdv: 0, adet: 0 };
      kutucuklar(y.toplam, y.kdv, y.adet);
      $('r-grafik-baslik').textContent = 'Yıllara göre harcama';
      const yillar = R.yillik.slice(-8);
      cubuklar(yillar, yillar.map((x) => x.yil), yillar.findIndex((x) => x.yil === R.yil) + 1);
      $('r-tablo-baslik').textContent = 'Yıllık özet';
      const top = R.yillik.reduce((s, x) => ({ t: s.t + x.toplam, k: s.k + x.kdv, a: s.a + x.adet }), { t: 0, k: 0, a: 0 });
      $('r-tablo').innerHTML = '<tr><th>Yıl</th><th>Toplam</th><th>KDV</th><th>KDV hariç</th><th>Adet</th></tr>' +
        R.yillik.slice().reverse().map((x) => `<tr class="tikla${x.yil === R.yil ? ' secili' : ''}" data-yil="${x.yil}"><td>${x.yil}</td><td>${para(x.toplam)}</td><td>${para(x.kdv)}</td><td>${para(x.toplam - x.kdv)}</td><td>${x.adet}</td></tr>`).join('') +
        `<tr class="toplam-satir"><td>Tümü</td><td>${para(top.t)}</td><td>${para(top.k)}</td><td>${para(top.t - top.k)}</td><td>${top.a}</td></tr>`;
      katTablosu(0);
    }
  }

  function katTablosu(ay) {
    const R = D.rapor;
    $('r-kat-baslik').textContent = 'Kategorilere göre — ' + (ay ? AYLAR[ay - 1] + ' ' : '') + R.yil;
    const satirlar = R.kategoriler.map((k) => ({ ad: k.ad, t: ay ? k.aylik[ay - 1] : k.toplam, kdv: ay ? k.aylikKdv[ay - 1] : k.kdv }))
      .filter((k) => k.t > 0).sort((a, b) => b.t - a.t);
    const top = satirlar.reduce((s, k) => s + k.t, 0);
    $('r-kat').innerHTML = satirlar.length ? '<tr><th>Kategori</th><th>Toplam</th><th>KDV</th><th>Pay</th></tr>' +
      satirlar.map((k) => `<tr><td>${esc(k.ad)}</td><td>${para(k.t)}</td><td>${para(k.kdv)}</td><td>%${top ? Math.round(k.t / top * 100) : 0}</td></tr>`).join('')
      : '<tr><td class="bos">Bu dönemde harcama yok.</td></tr>';
  }

  function aySec(ay) {
    if (D.raporMod === 'aylik') { D.seciliAy = D.seciliAy === ay ? 0 : ay; raporCiz(); }
  }
  $('r-grafik').addEventListener('click', (e) => {
    const el = e.target.closest('.cubuk-sar'); if (!el) return;
    if (D.raporMod === 'aylik') aySec(Number(el.dataset.i));
    else { const y = D.rapor.yillik.slice(-8)[Number(el.dataset.i) - 1]; if (y) { $('r-yil').value = y.yil; raporYukle(); } }
  });
  $('r-tablo').addEventListener('click', (e) => {
    const tr = e.target.closest('tr'); if (!tr) return;
    if (tr.dataset.ay) aySec(Number(tr.dataset.ay));
    if (tr.dataset.yil) { yilSecenekleri($('r-yil'), D.rapor.yillar, tr.dataset.yil); raporYukle(); }
  });

  // ------------------------------------------------------------------
  // Ayarlar
  // ------------------------------------------------------------------
  function ayarlariGoster(a) {
    D.ayarlar = a;
    $('gemini-durum').textContent = a.geminiVar ? 'kayıtlı' : 'yok'; $('gemini-durum').className = 'rozet' + (a.geminiVar ? ' var' : '');
    $('bh-durum').textContent = a.bhTokenVar ? 'kayıtlı' : 'yok'; $('bh-durum').className = 'rozet' + (a.bhTokenVar ? ' var' : '');
    $('a-gemini').value = ''; $('a-bh-token').value = '';
    $('a-model').value = a.geminiModel || '';
    $('a-bh-baslangic').value = a.bhBaslangic || '';
    $('a-bh-saat').value = a.bhSaat || '6';
    $('a-bh-filtre').value = a.bhFiltre || '';
    $('a-bh-kdv').value = a.bhKdvOrani || '';
    $('a-bh-aktif').checked = !!a.bhAktif;
    $('bh-son').textContent = a.bhSonCalisma ? 'Son aktarım: ' + a.bhSonCalisma + ' — ' + a.bhSonSonuc : '';
    $('link-sheet').href = a.sheetUrl; $('link-klasor').href = a.klasorUrl;
  }

  $('ayar-kaydet').addEventListener('click', async (e) => {
    try {
      const a = await mesgul(e.target, () => sunucu('ayarlariKaydet', {
        geminiKey: $('a-gemini').value.trim(), geminiModel: $('a-model').value.trim(),
        bhToken: $('a-bh-token').value.trim(), bhBaslangic: $('a-bh-baslangic').value, bhSaat: $('a-bh-saat').value,
        bhFiltre: $('a-bh-filtre').value.trim(), bhKdvOrani: $('a-bh-kdv').value.trim(), bhAktif: $('a-bh-aktif').checked
      }));
      ayarlariGoster(a); bildir('Ayarlar kaydedildi');
    } catch (err) { bildir(err.message, true); }
  });

  $('bh-test').addEventListener('click', async (e) => {
    const kutu = $('bh-test-sonuc');
    try {
      if ($('a-bh-token').value.trim()) await sunucu('ayarlariKaydet', Object.assign({}, D.ayarlar, { bhToken: $('a-bh-token').value.trim(), bhAktif: $('a-bh-aktif').checked }));
      const s = await mesgul(e.target, () => sunucu('bizimHesapTest'));
      kutu.hidden = false;
      kutu.textContent = '✓ Bağlantı başarılı\nCari sayısı: ' + s.cariSayisi +
        (s.ornekCariler.length ? '\nÖrnek cariler: ' + s.ornekCariler.join(', ') : '') +
        (s.ornek ? (s.ornek.hata ? '\nEkstre okunamadı: ' + s.ornek.hata
          : '\nÖrnek ekstre (' + s.ornek.cari + '): ' + s.ornek.hareketSayisi + ' hareket\nHareket türleri: ' + s.ornek.turler.join(', ')) : '');
      ayarlariGoster(await sunucu('ayarlariGetir'));
    } catch (err) { kutu.hidden = false; kutu.textContent = '✗ ' + err.message; }
  });

  $('bh-simdi').addEventListener('click', async (e) => {
    try {
      const s = await mesgul(e.target, () => sunucu('bizimHesapSenkron'));
      bildir(s.mesaj); D.kayitlarEski = D.raporEski = true;
      ayarlariGoster(await sunucu('ayarlariGetir'));
      if (s.yeni) { $('k-kontrol').checked = true; sayfaAc('kayitlar'); }
    } catch (err) { bildir(err.message, true); }
  });

  // ------------------------------------------------------------------
  // Başlangıç
  // ------------------------------------------------------------------
  (async function basla() {
    try {
      const v = await sunucu('ilkVeri');
      D.kategoriler = v.kategoriler; D.bugun = v.bugun;
      kategorileriDoldur(); ayarlariGoster(v.ayarlar); formTemizle();
      sunucu('harcamalariListele', { kontrol: true }).then((s) => rozet(s.kontrolSayisi)).catch(() => {});
    } catch (err) { bildir('Başlatılamadı: ' + err.message, true); }
  })();
})();
</script>
